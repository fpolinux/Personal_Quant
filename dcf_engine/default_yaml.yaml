# === DCF CONFIG ===
ticker: TICKER
metadata:
  as_of: YYYY-MM-DD   # date of inputs

data_source:
  # It is possible to keep some true and override selectively below by filling in below
  use_yfinance: true
  #overrides:
    # Any of these (if provided) will supersede yfinance values
    #shares_outstanding: xxx    # number
    #net_debt:           # negative = net cash
    #base_revenue: xxx          # FY24 revenue or latest

model:
  horizon_years: 5
  simulation_runs: 20000

  revenue:
    # Base is taken from data_source.overrides.base_revenue if provided; else pulled from yfinance if available.
    growth:
      dist: normal      # normal | triangular | uniform | fixed
      mean: 0.50
      sd: 0.01

  ebit_margin:
    # Use a distribution that reflects uncertainty
    dist: triangular    # normal | triangular | uniform | fixed
    low: 0.07
    mode: 0.09
    high: 0.11

  tax_rate:
    value: 0.28         # Effective tax rate, fixed 

  depreciation:
    # Select between % of reveue, 'absolute', or pct_of_pp&e 
    type: pct_of_revenue
    dist: normal
    value: 0.055
    sd: 0.005

  capex:
    type: pct_of_revenue
    dist: uniform
    low: 0.04
    high: 0.06

  wacc:
    dist: normal
    mean: 0.085
    sd: 0.01
    #clamp: [0.06, 0.14]    # optional min/max to avoid silly draws

  terminal_growth:
    dist: normal
    mean: 0.005
    sd: 0.003
    clamp: [-0.005, 0.05] # optional

  net_debt_treatment: include   # include | zero_out | treat_cash_as_strategic

output:
  histogram_bins: 60
  percentiles: [5, 10, 25, 50, 75, 90, 95]
