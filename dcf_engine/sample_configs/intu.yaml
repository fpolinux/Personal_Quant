# === DCF CONFIG ===
ticker: INTU #Intuit
metadata:
  as_of: 2025-10-8   # date of inputs

data_source:
  # If true, will pull data from yfinance; else use overrides
  use_yfinance: true
  #overrides:
    # Any of these (if provided) will supersede yfinance values
    #shares_outstanding: pass    # number
    #net_debt:           # negative = net cash
    #base_revenue: 4.067e8          # FY24 revenue or latest

model:
  horizon_years: 5
  simulation_runs: 10000

  revenue:
    # Base is taken from data_source.overrides.base_revenue if provided; else pulled from yfinance if available.
    growth:
      dist: normal      # normal | triangular | uniform | fixed
      # Using ln(EPS) = a + bt model with growth = b; sd drawn from sd = se * sqrt(n) from same regression
      mean: 0.1546
      sd: 0.0767

  ebit_margin:
    # Use a distribution that reflects uncertainty
    dist: triangular    # normal | triangular | uniform | fixed
    # Using ebit margins from Intuit (comparable)
    low: 0.207
    mode: 0.2366
    high: 0.2622

  tax_rate:
    value: 0.20     # Effective tax rate, fixed

  depreciation:
    # Select between % of reveue, 'absolute', or pct_of_pp&e 
    type: pct_of_revenue
    dist: normal
    value: 0.012
    sd: 0.01

  capex:
    type: pct_of_revenue
    dist: uniform
    low: 0.005
    high: 0.015

  wacc:
    dist: normal
    # SOFI WACC = 12.7% (BB)
    mean: 0.127
    sd: 0.02
    #clamp: [0.06, 0.14]    # optional min/max to avoid silly draws

  terminal_growth:
    dist: normal
    mean: 0.04
    sd: 0.01
    clamp: [-0.005, 0.05] # optional

  net_debt_treatment: include   # include | zero_out | treat_cash_as_strategic

output:
  histogram_bins: 60
  percentiles: [5, 10, 25, 50, 75, 90, 95]
